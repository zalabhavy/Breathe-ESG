databases:
  - name: breathe-esg-db
    plan: free
    databaseName: breathe_esg

services:
  - type: web
    name: breathe-esg
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build && cd ..
      mkdir -p backend/staticfiles/frontend
      cp -r frontend/dist/* backend/staticfiles/frontend/
      cd backend && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_demo
    startCommand: cd backend && gunicorn backend.wsgi --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.3"
